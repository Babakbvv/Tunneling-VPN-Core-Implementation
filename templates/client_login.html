<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود کاربران - پورتال VPN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: Tahoma, sans-serif; }
        .login-card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="container" style="max-width: 420px;">
    <div class="card login-card p-4 shadow-lg">
        <h3 class="text-center mb-4 fw-bold text-info">🔐 پورتال کاربران VPN</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show text-end" role="alert">
                 {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">نام کاربری</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">رمز عبور</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            
            <div class="mb-3 form-check text-end">
                <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
                <label class="form-check-label text-muted" for="rememberCheck">مرا به خاطر بسپار (نشست ۳۰ روزه)</label>
            </div>
            
            <button type="submit" class="btn btn-info w-100 fw-bold py-2 mt-2">ورود به حساب کاربری</button>
        </form>
    </div>
</div>

</body>
</html>
